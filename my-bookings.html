<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجوزاتي - GoHajz</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --gold: #C69C32; --gold-light: #E5C158; --green-deep: #123524; --green-darker: #0a1f16; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Tajawal', sans-serif; direction: rtl;
            background: var(--green-darker); color: #fff; min-height: 100vh; padding-bottom: 40px;
        }
        .top-bar {
            display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
            background: var(--green-deep); border-bottom: 1px solid #24392c;
        }
        .top-bar a { color: var(--gold-light); font-size: 1.2rem; text-decoration: none; }
        .top-bar h2 { color: var(--gold-light); font-size: 1.1rem; }
        .logout-link { font-size: 0.78rem; color: #ef4444; }
        .section { max-width: 500px; margin: 0 auto; padding: 16px; }
        .booking-card {
            background: #142a1f; border: 1px solid #24392c; border-radius: 12px;
            padding: 14px; margin-bottom: 10px;
        }
        .booking-card .top-row { display: flex; justify-content: space-between; align-items: center; }
        .booking-card .provider-name { color: var(--gold-light); font-weight: 900; font-size: 0.95rem; }
        .booking-card .details { font-size: 0.82rem; color: #ccc; margin-top: 6px; line-height: 1.7; }
        .status-badge { font-size: 0.68rem; padding: 3px 10px; border-radius: 10px; font-weight: bold; }
        .status-pending { background: #3d2e0d; color: #fbbf24; }
        .status-confirmed { background: #0d3d1a; color: #10b981; }
        .status-cancelled { background: #3d0d0d; color: #ef4444; }
        .empty-state { text-align: center; padding: 50px 20px; color: #777; }
        .login-prompt {
            text-align: center; padding: 40px 20px; background: #142a1f;
            border-radius: 14px; margin: 20px 16px; border: 1px solid var(--gold);
        }
        .login-prompt a {
            display: inline-block; margin-top: 14px; background: var(--gold); color: #000;
            padding: 10px 22px; border-radius: 8px; text-decoration: none; font-weight: 900;
        }
        .tabs { display: flex; gap: 6px; padding: 12px 16px 0; max-width: 500px; margin: 0 auto; }
        .tab-btn {
            flex: 1; padding: 10px; background: #142a1f; border: 1px solid #24392c;
            color: #ccc; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85rem;
        }
        .tab-btn.active { background: var(--gold); color: #000; font-weight: 900; border-color: var(--gold); }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .info-card {
            background: #142a1f; border: 1px solid #24392c; border-radius: 12px;
            padding: 14px; margin-bottom: 10px;
        }
        .info-row { display: flex; justify-content: space-between; padding: 7px 0;
                    border-bottom: 1px solid #1e3428; font-size: 0.85rem; }
        .info-row:last-child { border-bottom: none; }
        .info-row .lbl { color: #999; }
        .info-row .val { color: #fff; font-weight: bold; }
        input.pin-input {
            width: 100%; padding: 10px; background: #0a1f16; border: 1px solid #24392c;
            border-radius: 8px; color: #fff; font-size: 0.9rem; font-family: inherit;
            margin-bottom: 8px; direction: ltr; text-align: center; letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div style="display:flex;align-items:center;gap:10px;">
            <a href="index.html"><i class="fa-solid fa-arrow-right"></i></a>
            <h2>👤 حسابي</h2>
        </div>
        <a href="#" class="logout-link" onclick="handleLogout()">خروج</a>
    </div>

    <div class="tabs" id="accountTabs" style="display:none;">
        <button class="tab-btn active" onclick="switchAccountTab('info', this)">👤 معلوماتي</button>
        <button class="tab-btn" onclick="switchAccountTab('bookings', this)">📅 حجوزاتي</button>
    </div>

    <div id="loginPromptBox" class="section"></div>

    <div id="tab-info" class="section tab-pane active"></div>
    <div id="tab-bookings" class="section tab-pane"></div>

    <script src="gohajz-core.js"></script>
    <script>
        function switchAccountTab(name, btn) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            btn.classList.add('active');
        }

        (async function initAccountPage() {
            if (!isCustomerLoggedIn()) {
                document.getElementById('loginPromptBox').innerHTML = `
                    <div class="login-prompt">
                        <div style="font-size:2rem;">🔐</div>
                        <p style="color:#ccc;margin-top:10px;">
                            سجّل دخولك حتى تشوف حسابك وحجوزاتك
                        </p>
                        <a href="customer-login.html">تسجيل الدخول</a>
                    </div>
                `;
                return;
            }

            document.getElementById('accountTabs').style.display = 'flex';
            await ensureGuestSignedIn();
            loadMyInfo();
            loadMyBookingsTab();
        })();

        async function loadMyInfo() {
            const box = document.getElementById('tab-info');
            try {
                const info = await getCurrentCustomerInfo();
                if (!info) {
                    box.innerHTML = '<p class="empty-state">⚠️ تعذّر إيجاد بياناتك.</p>';
                    return;
                }

                box.innerHTML = `
                    <div class="info-card">
                        <div class="info-row"><span class="lbl">الاسم</span><span class="val">${info.name}</span></div>
                        <div class="info-row"><span class="lbl">رقم الهاتف</span><span class="val" style="direction:ltr;">${info.phone}</span></div>
                        <div class="info-row"><span class="lbl">الجنس</span><span class="val">${info.gender || '-'}</span></div>
                        <div class="info-row"><span class="lbl">تاريخ الميلاد</span><span class="val">${info.birthdate || '-'}</span></div>
                        <div class="info-row"><span class="lbl">المحافظة</span><span class="val">${info.governorate || '-'}</span></div>
                    </div>

                    <div class="info-card">
                        <h4 style="color:var(--gold-light);margin-bottom:10px;font-size:0.9rem;">
                            🔑 تغيير الرمز الشخصي
                        </h4>
                        <input type="password" id="newPin1" class="pin-input" inputmode="numeric"
                               placeholder="الرمز الجديد (4 أرقام على الأقل)">
                        <input type="password" id="newPin2" class="pin-input" inputmode="numeric"
                               placeholder="أعد كتابة الرمز الجديد">
                        <button onclick="handleChangePin()"
                                style="width:100%;padding:10px;background:var(--gold);color:#000;
                                       border:none;border-radius:8px;font-weight:900;cursor:pointer;
                                       font-family:inherit;">
                            حفظ الرمز الجديد
                        </button>
                        <p id="pinMsg" style="font-size:0.78rem;margin-top:8px;text-align:center;"></p>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                box.innerHTML = '<p class="empty-state">⚠️ تعذّر تحميل بياناتك.</p>';
            }
        }

        async function handleChangePin() {
            const pin1 = document.getElementById('newPin1').value.trim();
            const pin2 = document.getElementById('newPin2').value.trim();
            const msg  = document.getElementById('pinMsg');

            if (!pin1 || pin1.length < 4) {
                msg.style.color = '#ef4444'; msg.innerText = '⚠️ الرمز 4 أرقام على الأقل.'; return;
            }
            if (pin1 !== pin2) {
                msg.style.color = '#ef4444'; msg.innerText = '⚠️ الرمزين ما يتطابقون.'; return;
            }

            try {
                await updateCustomerPin(pin1);
                msg.style.color = '#10b981';
                msg.innerText = '✅ تم تغيير الرمز بنجاح!';
                document.getElementById('newPin1').value = '';
                document.getElementById('newPin2').value = '';
            } catch (err) {
                msg.style.color = '#ef4444';
                msg.innerText = '⚠️ ' + (err.message || 'صار خطأ.');
            }
        }

        async function loadMyBookingsTab() {
            const box = document.getElementById('tab-bookings');
            box.innerHTML = '<p class="empty-state">⏳ جاري التحميل...</p>';
            try {
                const bookings = await getMyBookings();
                if (bookings.length === 0) {
                    box.innerHTML = '<p class="empty-state">😕 ماكو حجوزات لك بعد</p>';
                    return;
                }

                const statusLabel = { pending: 'بانتظار التأكيد', confirmed: 'مؤكد ✅', cancelled: 'ملغي ❌' };

                box.innerHTML = bookings.map(b => `
                    <div class="booking-card">
                        <div class="top-row">
                            <span class="provider-name">${b.providerName}</span>
                            <span class="status-badge status-${b.status}">${statusLabel[b.status] || b.status}</span>
                        </div>
                        <div class="details">
                            ✂️ ${b.serviceName} — ${(b.servicePrice||0).toLocaleString('ar-IQ')} د.ع<br>
                            📅 ${b.bookingDate} — 🕐 ${b.bookingTime}
                            ${b.notes ? '<br>📝 ' + b.notes : ''}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                box.innerHTML = '<p class="empty-state">⚠️ تعذّر تحميل حجوزاتك. حاول تحدّث الصفحة.</p>';
            }
        }

        function handleLogout() {
            logOutCustomer();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
